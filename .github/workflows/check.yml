name: Check

on:
  pull_request:
  push:
    branches: [main]
  # The update workflow runs this after it commits a new release, because pushes made with
  # GITHUB_TOKEN do not start workflows.
  workflow_dispatch:

jobs:
  style:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew style Formula/firemq.rb

  # Installs the formula as published, from the FireMQ release archives, and runs its test.
  install:
    name: Install (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Put Homebrew on the PATH (Linux)
        if: runner.os == 'Linux'
        run: echo "/home/linuxbrew/.linuxbrew/bin" >> "$GITHUB_PATH"
      - name: Install and test
        run: |
          tap="$(brew --repository)/Library/Taps/firemq/homebrew-tap"
          mkdir -p "$tap" && cp -R Formula "$tap"/
          brew install firemq/tap/firemq
          brew test firemq/tap/firemq
          firemq --version
