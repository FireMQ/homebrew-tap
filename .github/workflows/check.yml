name: Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  style:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: brew style Formula/firemq.rb

  # Installs the formula from an archive built from source, packaged the way the FireMQ
  # release workflow packages it, and runs the formula's test.
  install:
    runs-on: macos-latest
    env:
      # Moves to a release tag once FireMQ v0.1.0 is out.
      FIREMQ_REF: b90a2ff9bda15a398c6957bfb291e4a9db9957ab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: FireMQ/firemq
          ref: ${{ env.FIREMQ_REF }}
          path: firemq
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firemq
      - name: Build and package
        run: |
          cd firemq
          cargo build --release --locked -p firemq
          name=firemq-aarch64-apple-darwin
          mkdir "$name" && cp target/release/firemq LICENSE README.md "$name"/
          tar -czf "$RUNNER_TEMP/$name.tar.gz" "$name"
      - name: Point the formula at the local archive
        run: |
          sum=$(shasum -a 256 "$RUNNER_TEMP/firemq-aarch64-apple-darwin.tar.gz" | awk '{print $1}')
          python3 - "$RUNNER_TEMP" "$sum" <<'PY'
          import re, sys
          tmp, sha = sys.argv[1:]
          p = "Formula/firemq.rb"
          s = open(p).read()
          s = re.sub(r'url "[^"]*aarch64-apple-darwin\.tar\.gz"\n(\s*)sha256 "[0-9a-f]+"',
                     lambda m: f'url "file://{tmp}/firemq-aarch64-apple-darwin.tar.gz"\n{m.group(1)}sha256 "{sha}"', s)
          open(p, "w").write(s)
          PY
          grep -n "aarch64-apple-darwin" -A1 Formula/firemq.rb
      - name: Install and test
        run: |
          tap="$(brew --repository)/Library/Taps/firemq/homebrew-tap"
          mkdir -p "$tap" && cp -R Formula "$tap"/
          brew install firemq/tap/firemq
          brew test firemq/tap/firemq
          firemq --version
